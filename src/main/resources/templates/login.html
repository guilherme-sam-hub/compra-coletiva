<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Compra Coletiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 16px 0;
            color: #999;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>🛒 Compra Coletiva</h1>
        <p>Entre na sua conta para continuar</p>
    </div>

    <!-- Mensagens de feedback -->
    <div th:if="${erro}" class="alert alert-error">
        <span>❌</span>
        <span th:text="${erro}">Mensagem de erro</span>
    </div>

    <div th:if="${sucesso}" class="alert alert-success">
        <span>✅</span>
        <span th:text="${sucesso}">Mensagem de sucesso</span>
    </div>

    <div th:if="${param.contaRemovida}" class="alert alert-success">
        <span>✅</span>
        <span>Sua conta foi removida. Até a próxima!</span>
    </div>
    <form th:action="@{/login}" method="post">

        <!-- Token CSRF (o Thymeleaf injeta automaticamente) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="username">Email</label>
            <input
                    type="email"
                    id="username"
                    name="username"
                    placeholder="seu@email.com"
                    required
                    autofocus>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required>
        </div>

        <button type="submit" class="btn-login">
            Entrar
        </button>
    </form>

    <div class="links">
        <a href="/usuarios/cadastro">Criar uma conta</a>
        <span class="divider"> • </span>
        <a href="/esqueci-senha">Esqueci minha senha</a>
    </div>
</div>
</body>
</html>
