<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; min-height: 100vh; }

        /* navbar vem do css/navbar.css */

        .container { max-width: 700px; margin: 0 auto; padding: 2rem; }
        .back-link { display: inline-block; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }

        .alert {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 1rem;
            font-size: 14px; display: flex; align-items: center; gap: 8px;
        }
        .alert-success { background: #efe; color: #3c3; border: 1px solid #cfc; }
        .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }

        .card {
            background: white; border-radius: 16px; padding: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; font-size: 2rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
        }
        h2 { text-align: center; color: #333; margin-bottom: 0.25rem; }
        .email { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }

        .info-row {
            display: flex; justify-content: space-between;
            padding: 0.75rem 0; border-bottom: 1px solid #f0f0f5;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; font-weight: 600; font-size: 0.9rem; }
        .info-value { color: #333; font-weight: 500; }

        .acoes {
            display: flex; flex-direction: column; gap: 0.75rem;
            margin-top: 2rem;
        }
        .btn-acao {
            padding: 12px; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            text-decoration: none; text-align: center;
            border: none; transition: transform 0.2s;
        }
        .btn-acao:hover { transform: translateY(-2px); }
        .btn-editar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-deletar {
            background: white; color: #dc2626;
            border: 2px solid #fecaca;
        }
        .btn-deletar:hover { background: #fef2f2; }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>🛒 Compra Coletiva</h1>
    <div class="nav-actions">
        <a th:href="@{/produtos}" class="nav-link">Produtos</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}" class="nav-link">Admin</a>
        <a th:href="@{/perfil}" class="nav-link">Meu perfil</a>
        <span class="user-name" th:text="${#authentication.name}">usuário</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-sair">Sair</button>
        </form>
    </div>
</nav>

<div class="container">
    <a th:href="@{/produtos}" class="back-link">← Voltar para produtos</a>

    <div th:if="${sucesso}" class="alert alert-success">
        <span>✅</span> <span th:text="${sucesso}"></span>
    </div>
    <div th:if="${erro}" class="alert alert-error">
        <span>⚠️</span> <span th:text="${erro}"></span>
    </div>

    <div class="card">
        <div class="avatar"
             th:text="${#strings.substring(usuario.nome, 0, 1).toUpperCase()}">U</div>
        <h2 th:text="${usuario.nome}">Nome</h2>
        <div class="email" th:text="${usuario.email}">email</div>

        <div class="info-row">
            <span class="info-label">CPF</span>
            <span class="info-value" th:text="${usuario.cpf}">000</span>
        </div>
        <div class="info-row">
            <span class="info-label">Cadastro</span>
            <span class="info-value"
                  th:text="${#temporals.format(usuario.dataCadastro, 'dd/MM/yyyy')}">01/01/2024</span>
        </div>
        <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value"
                  th:text="${usuario.ativo ? 'Ativo' : 'Inativo'}">Ativo</span>
        </div>

        <div class="acoes">
            <a th:href="@{/perfil/editar}" class="btn-acao btn-editar">Editar meus dados</a>

            <form th:action="@{/perfil/deletar}" method="post"
                  onsubmit="return confirm('Tem certeza que deseja DELETAR sua conta? Esta ação não pode ser desfeita.');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-acao btn-deletar"
                        style="width:100%;">Deletar minha conta</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
