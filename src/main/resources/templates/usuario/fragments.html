<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- FRAGMENTO: Formulário de Cadastro -->
<form  th:fragment="formulario"
       th:object="${usuario}"
       th:action="@{/usuarios/cadastro}"
       method="post"
       hx-post="/usuarios/cadastro"
       hx-target="#form-container"
       hx-swap="innerHTML"
       hx-indicator=".btn-cadastro"
       hx-disabled-elt="find button[type='submit']">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Erro global -->
    <div th:if="${erro}" class="alert alert-error">
        <span>❌</span>
        <span th:text="${erro}">Erro</span>
    </div>

    <!-- Nome -->
    <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" th:field="*{nome}"
               th:classappend="${#fields.hasErrors('nome')} ? 'error'"
               placeholder="Seu nome completo" required>
        <div th:if="${#fields.hasErrors('nome')}" class="error-message" th:errors="*{nome}"></div>
    </div>

    <!-- CPF -->
    <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" th:field="*{cpf}"
               th:classappend="${#fields.hasErrors('cpf')} ? 'error'"
               placeholder="000.000.000-00" required>
        <div th:if="${#fields.hasErrors('cpf')}" class="error-message" th:errors="*{cpf}"></div>
    </div>

    <!-- Email com validação em tempo real -->
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}"
               th:classappend="${#fields.hasErrors('email')} ? 'error'"
               placeholder="seu@email.com" required
               hx-post="/usuarios/validar-email"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#email-error"
               hx-swap="innerHTML"
               hx-indicator="#email-spinner">
        <div id="email-error">
            <div th:replace="~{usuario/fragments :: erro-campo}"></div>
        </div>
        <span id="email-spinner" class="htmx-indicator" style="font-size: 13px; color: #667eea;">⏳ verificando...</span>
        <div th:if="${#fields.hasErrors('email')}" class="error-message" th:errors="*{email}"></div>
    <!-- Senha -->
    <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" th:field="*{senha}"
               th:classappend="${#fields.hasErrors('senha')} ? 'error'"
               placeholder="Mínimo 6 caracteres" required>
        <div th:if="${#fields.hasErrors('senha')}" class="error-message" th:errors="*{senha}"></div>
    </div>

    <button type="submit" class="btn-cadastro">
        <span class="btn-text">Criar Conta</span>
        <span class="htmx-indicator">⏳ Criando...</span>
    </button>
</form>

<!-- FRAGMENTO: Mensagem de Sucesso -->
<div th:fragment="mensagem-sucesso">
    <div class="alert alert-success">
        <span>✅</span>
        <span th:text="${sucesso}">Sucesso!</span>
    </div>
    <script>
        setTimeout(() => window.location.href = '/login', 3000);
    </script>
    <p style="text-align: center; color: #666; margin-top: 20px;">
        Redirecionando para o login...
    </p>
</div>

<!-- FRAGMENTO: Mensagem de Erro Global -->
<div th:fragment="mensagem-erro">
    <div class="alert alert-error">
        <span>❌</span>
        <span th:text="${erro}">Erro</span>
    </div>
    <div th:replace="~{usuario/fragments :: formulario}"></div>
</div>

<!-- FRAGMENTO: Erro de Campo (usado na validação em tempo real) -->
<div th:fragment="erro-campo">
    <div th:if="${erroCampo}" class="error-message">
        <span>⚠️</span>
        <span th:text="${erroCampo}"></span>
    </div>
</div>

</body>
</html>
