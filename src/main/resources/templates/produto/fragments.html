<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- FRAGMENTO: Formulário de Cadastro de Produto -->
<form th:fragment="formulario"
      th:object="${produto}"
      th:action="@{/produtos/cadastro}"
      method="post"
      hx-post="/produtos/cadastro"
      hx-target="#form-container"
      hx-swap="innerHTML"
      hx-indicator=".btn-cadastro">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Erro global -->
    <div th:if="${erro}" class="alert alert-error">
        <span>⚠️</span>
        <span th:text="${erro}">Erro</span>
    </div>

    <!-- Nome -->
    <div class="form-group">
        <label for="nome">Nome do Produto</label>
        <input type="text" id="nome" th:field="*{nome}"
               th:classappend="${#fields.hasErrors('nome')} ? 'error'"
               placeholder="Ex: Fone Bluetooth Premium"
               required>
        <div th:if="${#fields.hasErrors('nome')}" class="error-message"
             th:errors="*{nome}"></div>
    </div>

    <!-- Descrição -->
    <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" th:field="*{descricao}"
                  th:classappend="${#fields.hasErrors('descricao')} ? 'error'"
                  placeholder="Detalhes do produto..."></textarea>
        <div th:if="${#fields.hasErrors('descricao')}" class="error-message"
             th:errors="*{descricao}"></div>
    </div>

    <!-- Preço -->
    <div class="form-group">
        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" th:field="*{preco}"
               th:classappend="${#fields.hasErrors('preco')} ? 'error'"
               placeholder="99.90" step="0.01" min="0.01"
               required>
        <div th:if="${#fields.hasErrors('preco')}" class="error-message"
             th:errors="*{preco}"></div>
    </div>

    <!-- Quantidade Mínima -->
    <div class="form-group">
        <label for="quantidadeMinima">Quantidade Mínima para Fechar</label>
        <input type="number" id="quantidadeMinima" th:field="*{quantidadeMinima}"
               th:classappend="${#fields.hasErrors('quantidadeMinima')} ? 'error'"
               placeholder="10" min="1" required>
        <div th:if="${#fields.hasErrors('quantidadeMinima')}" class="error-message"
             th:errors="*{quantidadeMinima}"></div>
    </div>

    <!-- Imagem URL (opcional) -->
    <div class="form-group">
        <label for="imagem">URL da Imagem (opcional)</label>
        <input type="url" id="imagem" th:field="*{imagem}"
               th:classappend="${#fields.hasErrors('imagem')} ? 'error'"
               placeholder="https://exemplo.com/imagem.jpg">
        <div th:if="${#fields.hasErrors('imagem')}" class="error-message"
             th:errors="*{imagem}"></div>
    </div>

    <button type="submit" class="btn-cadastro">
        <span class="btn-text">Cadastrar Produto</span>
        <span class="htmx-indicator">Salvando...</span>
    </button>
</form>

<!-- FRAGMENTO: Mensagem de Sucesso -->
<div th:fragment="mensagem-sucesso">
    <div class="alert alert-success">
        <span>✅</span>
        <span th:text="${sucesso}">Produto cadastrado!</span>
    </div>
    <script>
        setTimeout(() => window.location.href = '/produtos', 2000);
    </script>
    <p style="text-align: center; color: #666; margin-top: 20px;">
        Redirecionando para a lista de produtos...
    </p>
</div>

<!-- FRAGMENTO: Mensagem de Erro Global -->
<div th:fragment="mensagem-erro">
    <div class="alert alert-error">
        <span>⚠️</span>
        <span th:text="${erro}">Erro ao cadastrar</span>
    </div>
    <div th:replace="~{produto/fragments :: formulario}"></div>
</div>

<!-- FRAGMENTO: Mensagens do "Quero Participar" -->
<div th:fragment="mensagem-participacao-sucesso" class="alert alert-success">
    <span>✅</span>
    <span th:text="${sucesso}">Sucesso!</span>
</div>

<div th:fragment="mensagem-participacao-erro" class="alert alert-error">
    <span>⚠️</span>
    <span th:text="${erro}">Erro</span>
</div>
<!-- FRAGMENTOS: Mensagens do "Quero Participar" -->
<div th:fragment="mensagem-participacao-sucesso" class="alert alert-success">
    <span>✅</span>
    <span th:text="${sucesso}">Sucesso!</span>
</div>

<div th:fragment="mensagem-participacao-erro" class="alert alert-error">
    <span>⚠️</span>
    <span th:text="${erro}">Erro</span>
</div>

</body>
</html>
