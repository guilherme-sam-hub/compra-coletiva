<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
      <link rel="stylesheet" th:href="@{/css/navbar.css}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Usuários</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; min-height: 100vh; }

    .user-name {
      color: #ffffff !important;
      font-weight: 500;
      opacity: 0.95;
      padding: 0 8px;
    }

    .btn-sair {
      background: rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.45) !important;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-sair:hover {
      background: #ffffff !important;
      color: #764ba2 !important;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .back-link { display: inline-block; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 1rem; }

    .alert {
      padding: 12px 16px; border-radius: 8px; margin-bottom: 1rem;
      font-size: 14px; display: flex; align-items: center; gap: 8px;
    }
    .alert-success { background: #efe; color: #3c3; border: 1px solid #cfc; }
    .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }

    .card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #f0f0f5;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-header h2 { color: #333; font-size: 1.25rem; }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #f9fafb; }
    th {
      text-align: left; padding: 12px 16px;
      font-size: 0.85rem; color: #555;
      text-transform: uppercase; letter-spacing: 0.5px;
      font-weight: 700;
    }
    td { padding: 14px 16px; border-top: 1px solid #f0f0f5; color: #333; }
    tr:hover td { background: #fafbff; }

    .badge {
      display: inline-block; padding: 3px 10px;
      border-radius: 12px; font-size: 0.75rem; font-weight: 700;
    }
    .badge-ADMIN { background: #fef3c7; color: #b45309; }
    .badge-USER { background: #dbeafe; color: #1e40af; }

    .acoes { display: flex; gap: 8px; }
    .btn-acao {
      padding: 6px 12px; border-radius: 6px;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      border: none; transition: all 0.2s;
    }
    .btn-editar { background: #eef2ff; color: #4f46e5; }
    .btn-editar:hover { background: #e0e7ff; }
    .btn-deletar { background: #fee2e2; color: #b91c1c; }
    .btn-deletar:hover { background: #fecaca; }
    .btn-deletar:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<nav class="navbar">
  <h1>🛒 Compra Coletiva</h1>
  <div class="nav-actions">
    <a th:href="@{/produtos}" class="nav-link">Produtos</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}" class="nav-link">Admin</a>
    <a th:href="@{/perfil}" class="nav-link">Meu perfil</a>
    <span class="user-name" th:text="${#authentication.name}">usuário</span>
    <form th:action="@{/logout}" method="post" style="display:inline;">
      <button type="submit" class="btn-sair">Sair</button>
    </form>
  </div>
</nav>

<div class="container">
  <a th:href="@{/produtos}" class="back-link">← Voltar para produtos</a>

  <div th:if="${sucesso}" class="alert alert-success">
    <span>✅</span> <span th:text="${sucesso}"></span>
  </div>
  <div th:if="${erro}" class="alert alert-error">
    <span>⚠️</span> <span th:text="${erro}"></span>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Gerenciar Usuários</h2>
      <span style="color:#888; font-size:0.9rem;"
            th:text="${usuarios.size()} + ' usuário(s)'">0 usuários</span>
    </div>

    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>CPF</th>
        <th>Role</th>
        <th>Ações</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.nome}">Nome</td>
        <td th:text="${u.email}">email</td>
        <td th:text="${u.cpf}">000</td>
        <td>
                    <span class="badge" th:classappend="'badge-' + ${u.role}"
                          th:text="${u.role}">USER</span>
        </td>
        <td>
          <div class="acoes">
            <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}"
               class="btn-acao btn-editar">Editar</a>

            <form th:if="${u.role != 'ADMIN'}"
                  th:action="@{/admin/usuarios/{id}/deletar(id=${u.id})}"
                  method="post"
                  onsubmit="return confirm('Deletar usuário ' + this.dataset.nome + '?');"
                  th:attr="data-nome=${u.nome}"
                  style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn-acao btn-deletar">Deletar</button>
            </form>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
